name: surprise_combined
description: "Compounded crisis events injected with surprise=true dynamically at start_tick so policy has zero advance notice."
ticks: 288
seed: 12345
events:
  - type: demand_spike
    start_tick: 20
    duration_ticks: 96
    surprise: true
    parameters:
      multiplier: 1.6
  - type: supply_shortfall
    start_tick: 30
    duration_ticks: 1
    surprise: true
    parameters:
      factor: 0.5
  - type: route_disruption
    start_tick: 40
    duration_ticks: 48
    surprise: true
    parameters:
      route_ids:
        - route-patiya-karnaphuli
        - route-gazipur-mirpur
  - type: shipment_delay
    start_tick: 50
    duration_ticks: 1
    surprise: true
    parameters:
      delay_ticks: 24
  - type: station_outage
    start_tick: 100
    duration_ticks: 16
    surprise: true
    parameters:
      station_ids:
        - station-tongi
