apiVersion: apps/v1
kind: Deployment
metadata:
  name: fsip-frontend
  namespace: fsip
  labels:
    app: fsip-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fsip-frontend
  template:
    metadata:
      labels:
        app: fsip-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/iamasif53/fsip-frontend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /index.html
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /index.html
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: fsip-frontend
  namespace: fsip
spec:
  type: LoadBalancer
  selector:
    app: fsip-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
