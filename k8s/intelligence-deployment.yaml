apiVersion: apps/v1
kind: Deployment
metadata:
  name: fsip-intelligence
  namespace: fsip
  labels:
    app: fsip-intelligence
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fsip-intelligence
  template:
    metadata:
      labels:
        app: fsip-intelligence
    spec:
      containers:
        - name: intelligence
          image: ghcr.io/iamasif53/fsip-intelligence:1.0.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: fsip-config
            - secretRef:
                name: fsip-secrets
          ports:
            - containerPort: 8200
              name: http
          resources:
            requests:
              cpu: "500m"
              memory: "1024Mi"
            limits:
              cpu: "2000m"
              memory: "4096Mi"
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8200
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8200
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: fsip-intelligence
  namespace: fsip
spec:
  selector:
    app: fsip-intelligence
  ports:
    - protocol: TCP
      port: 8200
      targetPort: 8200
