apiVersion: apps/v1
kind: Deployment
metadata:
  name: fsip-engine
  namespace: fsip
  labels:
    app: fsip-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fsip-engine
  template:
    metadata:
      labels:
        app: fsip-engine
    spec:
      containers:
        - name: engine
          image: ghcr.io/iamasif53/fsip-engine:1.0.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: fsip-config
            - secretRef:
                name: fsip-secrets
          ports:
            - containerPort: 8100
              name: http
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2048Mi"
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8100
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8100
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: fsip-engine
  namespace: fsip
spec:
  selector:
    app: fsip-engine
  ports:
    - protocol: TCP
      port: 8100
      targetPort: 8100
