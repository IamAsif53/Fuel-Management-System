name: ci
on:
  push: {branches: [main]}
  pull_request: {}
  workflow_dispatch: {}

concurrency: {group: "ci-${{ github.ref }}", cancel-in-progress: true}

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: requirements-dev.txt}
      - run: pip install -r requirements-dev.txt && pip install -e libs/fsip_common
      - run: ruff check libs services
      - run: cd libs/fsip_common && python -m pytest -q
      - run: for s in engine intelligence api; do (cd services/$s && python -m pytest -q) || exit 1; done

  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm test
      - run: npm run build
