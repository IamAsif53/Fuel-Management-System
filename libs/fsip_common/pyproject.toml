[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fsip-common"
version = "0.1.0"
description = "Shared models and utilities for the Fuel Supply Intelligence Platform"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3", "pydantic-settings>=2.7,<3", "structlog>=24.4"]

[tool.setuptools.packages.find]
include = ["fsip_common*"]

[tool.setuptools.package-data]
"*" = ["*.j2", "*.json", "*.yaml", "*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
