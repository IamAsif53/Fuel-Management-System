global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'service', 'severity']
  group_wait: 5s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'fsip-api-webhook'

receivers:
  - name: 'fsip-api-webhook'
    webhook_configs:
      - url: 'http://api:8080/api/internal/alertmanager'
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials: 'change-me-internal'
